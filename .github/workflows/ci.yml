name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # torch from PyPI is large (~1 GB with bundled CUDA libs); the uv cache
      # keeps repeat runs fast. Revisit with a CPU-only torch index if CI time
      # becomes a problem.
      - name: Sync environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
