[project]
name = "gnn-nucleosynthesis"
version = "0.1.0"
description = "Conservation-by-construction GNN emulator of MESA silicon-burning networks (mesa_80/mesa_151), benchmarked against the Grichener et al. 2025 NNN"
readme = "README.md"
requires-python = ">=3.14"
# Pinned exact versions (resolved 2026-07-07 on Python 3.14.4 / linux x86_64);
# uv.lock is the full transitive lock. Bump deliberately, never silently.
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.11.0",
    "networkx==3.6.1",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "pynucastro==2.12.0",
    "pyyaml==6.0.3",
    "scipy==1.18.0",
    "torch==2.12.1",
    "torch-geometric==2.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "jupytext>=1.19.4",
    "nbstripout>=0.9.1",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn_nucleo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Upstream (Grichener 2025) code, patched minimally for portability — its
# style is not ours to fix; diffs against the originals must stay small.
extend-exclude = ["repro/nnn/patched"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# One-reaction-per-line nu-matrix setup uses semicolons deliberately.
"tests/test_conservation.py" = ["E702"]
# These fork-pool drivers must set OMP/OPENBLAS thread env vars BEFORE the
# numpy import (a fork inherits the parent's already-initialized BLAS pool),
# so a statement legitimately precedes the remaining module imports (E402).
"scripts/step5_run_fluxes.py" = ["E402"]
"scripts/step6_ingest_reruns.py" = ["E402"]
"scripts/step6_integrate_check.py" = ["E402"]
# Notebook cells import mid-file (E402) and figure captions run long (E501).
# I001: the bootstrap cell must sys.path-insert BETWEEN `import sys` and
# `import nbsupport`, which no import ordering can express.
"notebooks/**/*.ipynb" = ["E402", "E501", "I001"]
