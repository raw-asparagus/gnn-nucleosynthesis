# Exact isotope list of the mesa_80 nuclear reaction network, in network order.
# Provenance (sourced): column header of Zenodo 14873443 test datasets,
#   NuclearNeuralNetworks/test_datasets/mesa_80/mesa_80_output_files/output_T_9.201_rho_7.666.txt
#   (identical order in training_sets CSV columns initial_*/final_*).
# Cross-check: Grichener et al. 2025 (arXiv:2503.00115) Appendix A Table 1
#   lists the same isotopes EXCEPT ca41, which is present in the data but
#   missing from the paper's table (paper typo; data is authoritative).
# Names are MESA/pynucastro chem ids ('neut' = free neutron).
