derived: scripts/crosscheck_rates.py, 2026-07-10
policy: every entry is either explained in docs/rate-crosscheck.md or carried as an open flag into Step
  5 (flux derivations exclude or footnote unexplained channels)
explained_classes:
  db_inverse_bulk: 'signed median dlog10 grows 0.005->0.013 dex over T9 1.6->7.9: partition-function handling
    (MESA applies pf ratios to DB reverses; pynucastro evaluates JINA v-flag fits pf-free) plus winvn-vs-REACLIB
    mass/Q provenance. Individual flags only beyond 0.5 dex.'
  weak_tabular_bulk: 'interpolation scheme on the shared coarse tables: at the T9=5 table node median
    |dlog10| = 0.003; off-node medians 0.03-0.18 dex are MESA-bilinear vs pynucastro interpolant differences,
    largest for steep beta-minus channels. Labels used MESA''s bilinear values.'
  reaclib_forward_bulk: median |dlog10| = machine zero (bit-identical fits); channels beyond 0.05 dex
    are REACLIB snapshot refits (MESA jina 20171020 vs pynucastro 2.12.0 snapshot).
  appendixb: stock-r23.05.1 gh-575 channels, see configs/appendixb_excluded_channels.yaml; verified fixed
    in MESA 24.08.1 to <= 1.9 dex residual except r_h1_h1_he4_to_he3_he3 (2.7 dex in BOTH MESA versions
    => not a gh-575 channel; open flag).
